name: GhostType
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  GhostType:
    type: application
    platform: iOS
    sources:
      - path: GhostType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GhostType
        INFOPLIST_KEY_CFBundleDisplayName: GhostType
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: GhostType/GhostType.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.GhostType
    dependencies:
      - target: GhostTypeKeyboard
  GhostTypeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: GhostTypeKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GhostType.Keyboard
        INFOPLIST_KEY_CFBundleDisplayName: GhostType Keyboard
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.keyboard-service
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
        INFOPLIST_KEY_NSExtension_NSExtensionAttributes_RequestsOpenAccess: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: GhostTypeKeyboard/GhostTypeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.GhostType
